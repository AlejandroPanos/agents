[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "panosjimenezalejandro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "dotenv>=0.9.9",
    "fastapi>=0.162.1",
    "google-auth[requests]>=2.48.0",
    "httpx>=0.28.1",
    "PyJWT>=2.10.1",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
